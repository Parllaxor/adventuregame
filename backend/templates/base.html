<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #e94560;
            border-radius: 10px;
            padding: 40px;
        }
        
        h1 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        .stat {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.06), rgba(233, 69, 96, 0.03));
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.12);
            text-align: center;
        }
        
        .stat-label {
            color: #ffd700;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        .stat-value {
            color: #4ade80;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .event-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #e94560;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            min-height: 150px;
        }
        
        .event-title {
            color: #ffd700;
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .event-text {
            color: #e0e0e0;
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-line;
            margin-bottom: 20px;
        }
        
        .choices {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        
        .choice-btn {
            padding: 15px;
            background-color: #0f3460;
            color: #fff;
            border: 2px solid #e94560;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .choice-btn:hover {
            background-color: #1a5a7a;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.6);
            transform: translateY(-2px);
        }
        
        .choice-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .message {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid #4ade80;
            color: #4ade80;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 1.1rem;
            text-align: center;
            white-space: pre-line;
        }
        
        .inventory-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .inventory-title {
            color: #64c8ff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .inventory-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            font-size: 0.9rem;
        }
        
        .inventory-item {
            color: #e0e0e0;
            padding: 5px;
        }
        
        .loading {
            text-align: center;
            color: #ffd700;
            font-size: 1.2rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <h1>⚔️ ADVENTURE GAME ⚔️</h1>
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
